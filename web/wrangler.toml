# Cloudflare Worker: 정적 자산(dist) + /api/* (worker.js)
# name의 __WORKER_NAME__은 배포 워크플로가 CLOUDFLARE_WORKER_NAME 변수(없으면 저장소 이름)로 바꾼다.
name = "__WORKER_NAME__"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Workers Cache: Worker 앞단 캐시(*.workers.dev에서도 동작, Wrangler 4.69.0 이상 필요).
# 응답의 Cache-Control을 따른다: /api/index 30초, /api/stock/{code} 20초. no-store·POST는 캐시하지 않는다.
[cache]
enabled = true

[vars]
GITHUB_REPO = "uihansol/Dividend-10Y-Treasury-Screener"
GITHUB_BRANCH = "main"
# GITHUB_TOKEN 은 secret: 배포 워크플로가 WORKER_GITHUB_TOKEN 저장소 시크릿에서 넣는다

# 기기 간 '최근 조회' 동기화 코드 저장소(KV). id는 배포 워크플로가 네임스페이스를 만들거나 찾아서 채운다.
# 네임스페이스를 못 만들면(API 토큰 권한 부족 등) 이 블록 전체를 지우고 배포한다 — 그러면 /api/sync/*
# 가 "동기화 기능 설정 필요" 오류를 돌려줄 뿐, 사이트의 다른 기능에는 영향 없다.
# SYNC_KV_START
[[kv_namespaces]]
binding = "SYNC_KV"
id = "__SYNC_KV_ID__"
# SYNC_KV_END

# Cloudflare Worker: 정적 자산(dist) + /api/* (worker.js)
# name의 __WORKER_NAME__은 배포 워크플로가 CLOUDFLARE_WORKER_NAME 변수(없으면 저장소 이름)로 바꾼다.
name = "__WORKER_NAME__"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Workers Cache: Worker 앞단 캐시(*.workers.dev에서도 동작, Wrangler 4.69.0 이상 필요).
# 응답의 Cache-Control을 따른다: /api/index 30초, /api/stock/{code} 20초. no-store·POST는 캐시하지 않는다.
[cache]
enabled = true

[vars]
GITHUB_REPO = "uihansol/Dividend-10Y-Treasury-Screener"
GITHUB_BRANCH = "main"
# GITHUB_TOKEN 은 secret: 배포 워크플로가 WORKER_GITHUB_TOKEN 저장소 시크릿에서 넣는다

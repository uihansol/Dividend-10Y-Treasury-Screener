name: Diagnose (temporary)
# KT&G(00244455) 2026 Q1/H1 alotMatter 원본을 확인하기 위한 1회성 진단. 확인 후 삭제한다.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: disclist 2026
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -o pipefail
          python -m pipeline.update disclist 00244455 20260101 20260927 | tee /tmp/list.txt
          echo "::notice::$(cat /tmp/list.txt | cut -c1-6000)"

name: Stock batch refresh
# 검색창에서 쉼표로 여러 종목을 한꺼번에 추가했을 때(web/worker.js POST /api/stock/batch-refresh)
# 쓴다. 여기서는 직접 수집하지 않고, 받은 종목 목록을 시간차를 두고 하나씩 기존
# 'stock-refresh.yml'(종목 1개, KRX 로그인 포함)에 넘기기만 한다 — 여러 종목이 동시에 KRX에
# 로그인하면서 서로의 세션을 끊는 걸 줄이기 위한 시간차이며, 완전한 직렬화는 아니다(각 종목의
# 실제 수집·과거 데이터 보완은 그 뒤로도 한동안 걸릴 수 있어 뒤쪽 종목과 겹칠 수 있다).
run-name: batch refresh ${{ join(github.event.client_payload.codes, ', ') }}

on:
  repository_dispatch:
    types: [stock_batch_refresh]

permissions:
  contents: write   # 기본 토큰(github.token)으로 repository_dispatch를 보내려면 필요

jobs:
  stagger:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 종목별로 시간차를 두고 개별 수집 요청
        env:
          CODES_JSON: ${{ toJson(github.event.client_payload.codes) }}
          # 워크플로 기본 토큰도 repository_dispatch만큼은 새 실행을 만들 수 있다 → PAT가 만료돼도 이 단계는 동작한다.
          DISPATCH_TOKEN: ${{ github.token }}
        run: |
          echo "$CODES_JSON" | jq -r '.[]' > /tmp/codes.txt
          FIRST=1
          while IFS= read -r CODE; do
            [ -z "$CODE" ] && continue
            echo "$CODE" | grep -Eq '^[0-9]{6}$' || { echo "::warning::잘못된 종목코드라 건너뜀: $CODE"; continue; }
            if [ "$FIRST" != "1" ]; then
              echo "다음 종목까지 45초 대기…"
              sleep 45
            fi
            FIRST=0
            echo "::notice::$CODE 수집 요청"
            STATUS="$(curl -sS -o /tmp/dispatch_out.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d "{\"event_type\":\"stock_refresh\",\"client_payload\":{\"code\":\"$CODE\",\"force\":\"false\"}}")"
            if [ "$STATUS" != "204" ]; then
              echo "::warning::$CODE 수집 요청 실패 (HTTP $STATUS): $(cat /tmp/dispatch_out.txt)"
            fi
          done < /tmp/codes.txt

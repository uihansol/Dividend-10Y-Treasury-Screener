name: Deploy

# 정적 화면 + /api Worker를 Cloudflare Workers에 배포.
# 종목 데이터는 배포에 포함하지 않는다(Worker가 저장소 캐시를 실시간으로 읽음).
# 검색용 master.json만 정적 파일로 함께 올리므로 master가 바뀌면 다시 배포한다.
on:
  push:
    branches: [main]
    paths: ["web/**", "data/stocks/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 검색용 master 복사
        run: |
          mkdir -p web/public/data
          if [ -f data/stocks/master.json ]; then cp data/stocks/master.json web/public/data/master.json
          else echo '{"stocks":{}}' > web/public/data/master.json; echo "::warning::master.json 없음 — Common data(init)를 먼저 실행하세요"; fi

      - run: npm ci
        working-directory: web
      - name: 빌드 버전 주입
        env:
          VITE_APP_BUILD: ${{ github.run_number }}
          VITE_APP_SHA: ${{ github.sha }}
        run: npm run build
        working-directory: web

      - name: 비밀값이 번들에 없는지 확인
        run: |
          ! grep -rE "DART_API_KEY|KRX_PW|github_pat_|ghp_" web/dist || { echo "비밀값 흔적 발견"; exit 1; }

      - name: Worker 이름 설정
        if: env.HAS_CF == 'true'
        working-directory: web
        run: |
          NAME="${{ vars.CLOUDFLARE_WORKER_NAME }}"
          if [ -z "$NAME" ]; then NAME="$(echo '${{ github.repository }}' | sed 's#.*/##' | tr '[:upper:]_' '[:lower:]-')"; fi
          sed -i "s/__WORKER_NAME__/$NAME/" wrangler.toml
          sed -i "s#^GITHUB_REPO = .*#GITHUB_REPO = \"${{ github.repository }}\"#" wrangler.toml

      # 기기 간 '최근 조회' 동기화 코드를 저장할 KV 네임스페이스. 이름으로 기존 것을 찾고 없으면 새로 만든다
      # (재배포마다 새로 만들지 않도록). 토큰에 Workers KV Storage 편집 권한이 없는 등 실패하면 wrangler.toml의
      # kv_namespaces 블록을 통째로 지우고 계속 진행한다 — 동기화 코드 기능만 꺼지고 나머지는 정상 배포된다.
      - name: 동기화 KV 네임스페이스 확인/생성
        if: env.HAS_CF == 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TITLE="dividend10y-recent-sync"
          ID="$(npx -y wrangler@4 kv namespace list 2>/dev/null | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .id' | head -1)"
          if [ -z "$ID" ]; then
            OUT="$(npx -y wrangler@4 kv namespace create "$TITLE" 2>&1)" || echo "$OUT"
            ID="$(echo "$OUT" | grep -oE '"id": *"[a-f0-9]+"' | grep -oE '[a-f0-9]+' | head -1)"
          fi
          if [ -n "$ID" ]; then
            sed -i "s/__SYNC_KV_ID__/$ID/" wrangler.toml
            sed -i '/# SYNC_KV_START/d; /# SYNC_KV_END/d' wrangler.toml
          else
            echo "::warning::동기화 KV 네임스페이스를 준비하지 못해 '최근 조회 동기화 코드' 기능 없이 배포합니다 (CLOUDFLARE_API_TOKEN에 Workers KV Storage 편집 권한이 있는지 확인하세요)."
            sed -i '/# SYNC_KV_START/,/# SYNC_KV_END/d' wrangler.toml
          fi

      # 있는 시크릿만 Worker 비밀값으로 올린다(값은 출력하지 않고 이름만 목록으로 만든다).
      #  - GITHUB_TOKEN(←WORKER_GITHUB_TOKEN): 없으면 /api 가 설정 안내 오류를 반환
      #  - KRX_ID·KRX_PW: 없으면 /live(KRX 직접 조회 잠정 반영)만 꺼지고 나머지는 그대로 동작
      - name: Worker 비밀값 목록
        id: wsecrets
        if: env.HAS_CF == 'true'
        env:
          HAS_GH: ${{ secrets.WORKER_GITHUB_TOKEN != '' }}
          HAS_KRX: ${{ secrets.KRX_ID != '' && secrets.KRX_PW != '' }}
        run: |
          {
            echo "list<<EOF"
            if [ "$HAS_GH" = "true" ]; then echo GITHUB_TOKEN; fi
            if [ "$HAS_KRX" = "true" ]; then echo KRX_ID; echo KRX_PW; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        id: deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: web
          command: deploy
          secrets: ${{ steps.wsecrets.outputs.list }}

      - name: 배포 주소
        if: steps.deploy.outcome == 'success'
        run: |
          echo "::notice::배포 주소 ${{ steps.deploy.outputs.deployment-url }}"
          [ -n "${{ secrets.WORKER_GITHUB_TOKEN }}" ] || echo "::warning::WORKER_GITHUB_TOKEN 시크릿이 없어 /api 가 동작하지 않습니다"

      - name: Cloudflare 미설정 안내
        if: env.HAS_CF != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN 시크릿이 없어 빌드만 하고 배포는 건너뜁니다."

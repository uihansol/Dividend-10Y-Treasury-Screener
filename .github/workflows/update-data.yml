name: Update data

# 최초 구축은 수동으로 mode=initial을 선택하고,
# 이후 평일 자동 실행은 incremental만 수행한다.
on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - initial
      start:
        description: "initial 재시작용 prices 시작일 YYYY-MM-DD (보통 비워둠)"
        required: false
        default: ""
      max_days:
        description: "initial에서 받을 최대 거래일 수 (비워두면 오늘까지)"
        required: false
        default: ""

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="incremental"; fi

          ARGS=""
          if [ -n "${{ github.event.inputs.start }}" ]; then ARGS="$ARGS --start ${{ github.event.inputs.start }}"; fi
          if [ -n "${{ github.event.inputs.max_days }}" ]; then ARGS="$ARGS --max-days ${{ github.event.inputs.max_days }}"; fi

          echo "Running pipeline mode: $MODE"
          python -m pipeline.update "$MODE" $ARGS

      - name: Commit updated source data
        run: |
          git config user.name "kr-div-us10y-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: 데이터 업데이트 $(date -u +%Y-%m-%d)"
          git push

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: web/public/data
          retention-days: 3

  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

name: Common data (US10Y + master)

# 전체 종목 가격·배당을 수집하지 않는다. 모든 종목이 공통으로 쓰는 데이터만 관리한다.
#  - 미국 10년물(DGS10): 평일 매일 증분 업데이트 → 이미 조회한 종목만 네트워크 없이 재계산
#  - 종목 master(검색용 목록): 매주 월요일 갱신
on:
  schedule:
    - cron: "0 22 * * 0-4"     # 월~금 KST 07:00 (미국 전날 금리 반영)
  workflow_dispatch:
    inputs:
      task:
        description: "init = 10Y + master (최초 구축) / us10y / master"
        required: true
        default: init
        type: choice
        options: [init, us10y, master]

concurrency:
  group: common-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Update
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TASK: ${{ github.event.inputs.task }}
        run: |
          if [ -n "$TASK" ]; then T="$TASK"
          elif [ "$(date -u +%u)" = "7" ]; then T="init"      # 일요일 UTC(=월요일 KST) 실행분은 master도 갱신
          else T="us10y"; fi
          python -m pipeline.update "$T" | tee /tmp/out.txt
          python -m pipeline.update index | tee -a /tmp/out.txt
          # 결과를 실행 요약(annotation)으로 남김
          while IFS= read -r line; do echo "::notice::${line:0:900}"; done < /tmp/out.txt

      - name: Commit (종목 분석 커밋과 겹쳐도 안전하게 재시도)
        run: |
          git config user.name "dividend-bot"
          git config user.email "actions@users.noreply.github.com"
          # 'Update' 단계 결과(10Y + 재계산된 캐시)를 전부 백업해 둔다.
          # data/cache는 git에 추적되는 파일이라 아래 'git reset --hard'가 커밋 전 상태로 되돌리므로,
          # 백업 없이 reset하면 recompute_cached()가 만든 변경이 그대로 사라진다.
          mkdir -p /tmp/keep
          for p in data/us10y data/stocks data/sources.json data/cache; do [ -e "$p" ] && cp -r "$p" /tmp/keep/; done
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp -r /tmp/keep/. data/
            python -m pipeline.update index > /dev/null
            for p in data/us10y data/stocks data/sources.json data/cache; do [ -e "$p" ] && git add "$p"; done
            git diff --cached --quiet && { echo "변경 없음"; exit 0; }
            git commit -q -m "data: common $(date -u +%F)"
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 6 + 3))
          done
          exit 1
